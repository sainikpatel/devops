apiVersion: apps/v1
kind: Deployment

metadata:
  name: node-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nodeapp

  template:
    metadata:
      labels:
        app: nodeapp

    spec:
      containers:
        - name: nodecontainer
          image: nodeapp
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
